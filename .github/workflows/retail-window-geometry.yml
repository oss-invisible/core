name: retail-window-geometry

# The geometry of a maximized, then restored, main window of the official retail Firefox on a GitHub Windows
# runner, at the display scales of captures/WINDOW_GEOMETRY_REQUEST.json set for real in Windows (scripts under
# scripts/retail/window_geometry/). It runs when a pull request or a push to main changes that file, and never by
# hand or on a schedule. One job per scale, one browser at a time, one runner each: the account runs at most
# 20 jobs at once. The raw JSON files are the artifact; they are committed by hand to a private capture
# repository afterwards, not to this one.
#
# MARIONETTE EXCEPTION. This capture launches retail Firefox with -marionette, unlike retail-capture.yml (plain
# launch), because reproducing Juggler's resize needs chrome-privileged script (and so MOZ_REMOTE_ALLOW_SYSTEM_ACCESS=1,
# which Marionette requires for it; no other MOZ_* variable): the restored window is produced by
# exactly the line Juggler runs (TargetRegistry.js setViewportSize: window.resizeBy). Proof that Marionette does not
# change the frame: at every scale reached live, the maximized geometry measured here must equal invisible_core
# WINDOW_FRAME_BY_DPR and declared_maximized_ui (measured from plain launches) exactly, or the scale is not valid (judge.py).
#
# Round 2 (the `round` of the request) adds, per scale: Juggler's whole sequence at 390x844 CSS (steps juggler and
# juggler_rdm), at scales 1 and 1.25 a grid of restored windows and the minimum window, the maximized step at every
# resolution Windows offers (launch m) and, at scale 1, at devPixelsPerPx 0.75 and 0.5; a scale Windows does not reach
# (2) runs only the devPixelsPerPx launches p and q. The grid and the m launches take most of the job.
# Round 4 adds to every a, b, p and q launch two more calls of Juggler's sequence in a row (steps juggler2, at 414 CSS
# wide, and juggler_back, at the content size of the maximized window), a few seconds per launch.
# Round 5 adds to launches a and b (p and q at a scale Windows does not reach) fifteen steps (plan.ROUND5_STEPS): on the
# maximized window, before any Juggler call, element fullscreen entered by a real click (SendInput on a button whose handler
# calls requestFullscreen: Marionette cannot give the user activation) and left by exitFullscreen, F11-style fullscreen
# (window.fullScreen), a same-origin and a cross-site iframe (both local), the same two origins under scale(1.5) and
# rotate(10deg) (iframes_transformed: four frames one at a time, every mouse event each saw at three points of its transformed
# area, about 20 seconds per compared launch) and two popups opened by a real click (width and
# height; and with left and top); right after juggler and juggler_rdm, Juggler's first call again at exactly its size
# (juggler_repeat); after juggler2, the same Juggler call again at exactly its size, the fullscreen steps and
# the iframes on the window Juggler left. Every step's content record carries the page's probe (screen.pixelDepth included).
# These steps add about two minutes to each of the two compared launches (about four per job), so the job has 60 minutes (it had 45) and
# run_scale.TIME_BUDGET_SECONDS is 49 minutes (it was 34).
# Round 7 adds no step and no launch: the frame page (surface.html) now starts with an inline script that stores what the frame
# reads at parse time, at DOMContentLoaded, at the first and second animation frame and at load (mozInnerScreenX/Y, screenX/Y, outer
# and inner size, devicePixelRatio, performance.now), and the frame's record answer carries it as `early` (iframes_max, iframes_juggler
# and iframes_transformed). Each iframe step already adds new iframe elements, so each frame is a new document and `parse` is its first
# moment. The judge prints one line per frame per moment next to the settled reading and the parent's mozInnerScreen, and the
# differences of launch a and b in them, not judged. The time budget is kept: a script of five reads per frame adds nothing
# measurable, the job has the same 60 minutes and run_scale.TIME_BUDGET_SECONDS the same 49 minutes.
#
# The `judge` job is the one verdict: it reads every artifact, prints the table, and is red when a scale is
# missing, a launch left a process, launch a differs from launch b (p from q) on any step, the round 5 ones included (a
# round 5 step is a record, skipped, or not possible with its reason, which the judge prints; a missing one is red), the
# grid check of launch b differs from launch a, or a scale reached live differs from what the core declares (border,
# screenX and the bar the density rule gives at the measured availHeight).
#
# Same trigger shape as ci.yml (tests/test_ci_runs_once_per_commit.py): pull requests through `pull_request`,
# `push` only for main, a new push to a pull request replaces the run it supersedes.
on:
  push:
    branches: [main]
    paths: [captures/WINDOW_GEOMETRY_REQUEST.json]
  pull_request:
    paths: [captures/WINDOW_GEOMETRY_REQUEST.json]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  request:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      firefox_version: ${{ steps.request.outputs.firefox_version }}
      dpr: ${{ steps.request.outputs.dpr }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (v4.4.0)
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 (v5.6.0)
        with:
          python-version: "3.12"
      - name: read captures/WINDOW_GEOMETRY_REQUEST.json
        id: request
        run: python scripts/retail/window_geometry/request.py | tee -a "$GITHUB_OUTPUT"

  capture:
    needs: request
    runs-on: windows-2025
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        dpr: ${{ fromJSON(needs.request.outputs.dpr) }}
    # The profile of the browser is made in TEMP: on D:, like every Windows job that launches a browser
    # (tests/test_ci_windows_temp_is_on_d.py).
    env:
      TEMP: 'D:\a\_temp'
      TMP: 'D:\a\_temp'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (v4.4.0)
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 (v5.6.0)
        with:
          python-version: "3.12"

      # The official installer of the requested version, from archive.mozilla.org: sha256 against SHA256SUMS,
      # SHA256SUMS.asc against the release signing key committed in captures/runner/, extracted with 7z.
      # Nothing is installed.
      - name: fetch, verify and extract the official build
        shell: bash
        run: python scripts/retail/firefox_build.py fetch --version "${{ needs.request.outputs.firefox_version }}" --work "$RUNNER_TEMP/ff"

      # Sets each resolution and then the display scale for real, launches firefox.exe -no-remote -profile
      # <empty directory> -marionette <page>, measures, and ends every process of the install folder.
      - name: capture
        shell: bash
        run: |
          python scripts/retail/window_geometry/run_scale.py \
            --install "$RUNNER_TEMP/ff/extracted/core" --build "$RUNNER_TEMP/ff/build.json" \
            --request captures/WINDOW_GEOMETRY_REQUEST.json --dpr ${{ matrix.dpr }} --out "$RUNNER_TEMP/out"

      - name: keep the build record beside the results
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          if [ -f "$RUNNER_TEMP/ff/build.json" ]; then cp "$RUNNER_TEMP/ff/build.json" "$RUNNER_TEMP/out/build.json"; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 (v4.6.2)
        if: always()
        with:
          name: retail-window-geometry-${{ needs.request.outputs.firefox_version }}-dpr${{ matrix.dpr }}
          path: ${{ runner.temp }}/out
          if-no-files-found: warn
          retention-days: 90

  judge:
    needs: [request, capture]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (v4.4.0)
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 (v5.6.0)
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4 (v4.3.0)
        with:
          pattern: retail-window-geometry-*
          path: judge-in
      - name: the verdict
        run: python scripts/retail/window_geometry/judge.py --in judge-in --request captures/WINDOW_GEOMETRY_REQUEST.json
