name: retail-window-geometry

# The geometry of the maximized main window of the official retail Firefox on a GitHub Windows runner, and what a page of it
# reads, at the display scales of captures/WINDOW_GEOMETRY_REQUEST.json set for real in Windows (scripts under
# scripts/retail/window_geometry/). It runs when a pull request or a push to main changes that file, and never by
# hand or on a schedule. One job per scale, one browser at a time, one runner each: the account runs at most
# 20 jobs at once. The raw JSON files are the artifact; they are committed by hand to a private capture
# repository afterwards, not to this one.
#
# MARIONETTE EXCEPTION. This capture launches retail Firefox with -marionette, unlike retail-capture.yml (plain launch), because
# maximizing the window, reading the chrome (the window state, the browser's rectangle) and window fullscreen need
# chrome-privileged script (and so MOZ_REMOTE_ALLOW_SYSTEM_ACCESS=1, which Marionette requires for it; no other MOZ_* variable).
# Proof that Marionette does not change the frame: at every scale reached live, the maximized geometry measured here must equal
# invisible_core WINDOW_FRAME_BY_DPR and declared_maximized_ui (measured from plain launches) exactly, or the scale is not valid
# (judge.py).
#
# What a job measures (plan.py), per scale: the maximized step at every resolution Windows offers (launch m) and, at scale 1, at
# devPixelsPerPx 0.75 and 0.5; at a scale Windows does not reach (2) only the devPixelsPerPx launches p and q. Round 5 adds to
# launches a and b (p and q at a scale Windows does not reach) eight steps (plan.ROUND5_STEPS): on the maximized window element
# fullscreen entered by a real click (SendInput on a button whose handler calls requestFullscreen: Marionette cannot give the user
# activation) and left by exitFullscreen, F11-style fullscreen (window.fullScreen), a same-origin and a cross-site iframe (both
# local), the same two origins under scale(1.5) and rotate(10deg) (iframes_transformed: four frames one at a time, every mouse
# event each saw at three points of its transformed area, about 20 seconds per compared launch) and two popups opened by a real
# click (width and height; and with left and top). Every step's content record carries the page's probe (screen.pixelDepth included).
# Round 7 adds no step to the launches that are compared. The frame page (surface.html) starts with an inline script that stores
# what the frame reads at parse time, at DOMContentLoaded, at the first and second animation frame and at load (mozInnerScreenX/Y,
# screenX/Y, outer and inner size, devicePixelRatio, performance.now), and the frame's record answer carries it as `early`
# (iframes_max and iframes_transformed). Each iframe step adds new iframe elements, so each frame is a new document and `parse` is
# its first moment. The judge prints one line per frame per moment next to the settled reading and the parent's mozInnerScreen,
# and the differences of launch a and b in them, not judged. A script of five reads per frame adds nothing measurable to a launch.
# Round 8 takes the restored-window steps out of the plan, and so out of the judged set: the restored-window feature is dropped from
# the product, so the capture no longer measures it (Juggler's resize in its calls, the call at the size of the maximized content,
# the plain resize, the fullscreen and the iframes from the window Juggler left, the grid of restored windows and the minimum
# window, the host-gate page under inRDMPane). Launch n, the maximized window on a panel tall enough for the normal UI density at
# scale 2, goes too: the runner's display refuses panels above 1920x1080 (code -2), so it can never run there. A job still takes
# everything about the maximized window, fullscreen from it, popups, iframes_max, iframes_transformed and the frames' early readings.
# The red of round 7 on iframes_juggler (events.count 2 against 3 at dpr 1.5, run 46061552952) leaves with the step: the step is not
# measured any more, and that is the only reason it leaves the verdict, not a way around the red.
# The job has 30 minutes (it had 60) and run_scale.TIME_BUDGET_SECONDS is 20 minutes (it was 49): the jobs of round 7, with the
# restored-window steps and the grid still in them, took 4 to 11 minutes, and the steps that remain are the shorter part of them.
#
# The `judge` job is the one verdict: it reads every artifact, prints the table, and is red when a scale is
# missing, a launch left a process, launch a differs from launch b (p from q) on any step, the round 5 ones included (a
# round 5 step is a record or not possible with its reason, which the judge prints; a missing one is red), or a scale reached live
# differs from what the core declares (border, screenX and the bar the density rule gives at the measured availHeight).
#
# Same trigger shape as ci.yml (tests/test_ci_runs_once_per_commit.py): pull requests through `pull_request`,
# `push` only for main, a new push to a pull request replaces the run it supersedes.
on:
  push:
    branches: [main]
    paths: [captures/WINDOW_GEOMETRY_REQUEST.json]
  pull_request:
    paths: [captures/WINDOW_GEOMETRY_REQUEST.json]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  request:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      firefox_version: ${{ steps.request.outputs.firefox_version }}
      dpr: ${{ steps.request.outputs.dpr }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (v4.4.0)
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 (v5.6.0)
        with:
          python-version: "3.12"
      - name: read captures/WINDOW_GEOMETRY_REQUEST.json
        id: request
        run: python scripts/retail/window_geometry/request.py | tee -a "$GITHUB_OUTPUT"

  capture:
    needs: request
    runs-on: windows-2025
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        dpr: ${{ fromJSON(needs.request.outputs.dpr) }}
    # The profile of the browser is made in TEMP: on D:, like every Windows job that launches a browser
    # (tests/test_ci_windows_temp_is_on_d.py).
    env:
      TEMP: 'D:\a\_temp'
      TMP: 'D:\a\_temp'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (v4.4.0)
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 (v5.6.0)
        with:
          python-version: "3.12"

      # The official installer of the requested version, from archive.mozilla.org: sha256 against SHA256SUMS,
      # SHA256SUMS.asc against the release signing key committed in captures/runner/, extracted with 7z.
      # Nothing is installed.
      - name: fetch, verify and extract the official build
        shell: bash
        run: python scripts/retail/firefox_build.py fetch --version "${{ needs.request.outputs.firefox_version }}" --work "$RUNNER_TEMP/ff"

      # Sets each resolution and then the display scale for real, launches firefox.exe -no-remote -profile
      # <empty directory> -marionette <page>, measures, and ends every process of the install folder.
      - name: capture
        shell: bash
        run: |
          python scripts/retail/window_geometry/run_scale.py \
            --install "$RUNNER_TEMP/ff/extracted/core" --build "$RUNNER_TEMP/ff/build.json" \
            --request captures/WINDOW_GEOMETRY_REQUEST.json --dpr ${{ matrix.dpr }} --out "$RUNNER_TEMP/out"

      - name: keep the build record beside the results
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          if [ -f "$RUNNER_TEMP/ff/build.json" ]; then cp "$RUNNER_TEMP/ff/build.json" "$RUNNER_TEMP/out/build.json"; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 (v4.6.2)
        if: always()
        with:
          name: retail-window-geometry-${{ needs.request.outputs.firefox_version }}-dpr${{ matrix.dpr }}
          path: ${{ runner.temp }}/out
          if-no-files-found: warn
          retention-days: 90

  judge:
    needs: [request, capture]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (v4.4.0)
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 (v5.6.0)
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4 (v4.3.0)
        with:
          pattern: retail-window-geometry-*
          path: judge-in
      - name: the verdict
        run: python scripts/retail/window_geometry/judge.py --in judge-in --request captures/WINDOW_GEOMETRY_REQUEST.json
